services:
  - type: web
    name: ionos-imap-mcp
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: ACCESS_TOKEN
        generateValue: true
      - key: IMAP_HOST
        value: imap.ionos.de
      - key: IMAP_PORT
        value: "993"
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASSWORD
        sync: false
